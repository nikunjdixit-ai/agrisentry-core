services:
  # ----------------------------------------------------
  # 1. AgriSentry Backend Web Service (FastAPI)
  # ----------------------------------------------------
  - type: web
    name: agrisentry-api
    runtime: python
    region: oregon
    plan: free
    branch: feature/member1-member2-integration
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: VOICE_OUTPUT_DIRECTORY
        value: voice_outputs

  # ----------------------------------------------------
  # 2. AgriSentry Frontend Static Site (React + Vite)
  # ----------------------------------------------------
  - type: web
    name: agrisentry-ui
    runtime: static
    region: oregon
    plan: free
    branch: feature/member1-member2-integration
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: agrisentry-api
          property: host
